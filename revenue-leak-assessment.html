<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revenue Leak Assessment — ScaleFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15170F;
    --ink-soft:rgba(21,23,15,.56);
    --ink-faint:rgba(21,23,15,.3);
    --paper:#FCFDF7;
    --lime:#DCF25C;
    --line:rgba(21,23,15,.1);
    --shadow:0 2px 3px rgba(21,23,15,.03), 0 14px 30px -14px rgba(21,23,15,.14);
    --w:600px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;color:var(--ink);
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:16px;line-height:1.45;letter-spacing:-.01em;
    background:#EDEFDD;
    overflow:hidden;
  }
  /* ---- ambient wash ---- */
  .wash{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(80vw 70vh at 88% 104%, rgba(150,196,224,calc(.42 + var(--p,0)*.30)) 0%, rgba(150,196,224,0) 62%),
      radial-gradient(70vw 60vh at 6% 96%,  rgba(200,224,178,.45) 0%, rgba(200,224,178,0) 60%),
      radial-gradient(90vw 70vh at 50% -10%, rgba(252,253,247,.9) 0%, rgba(252,253,247,0) 70%),
      linear-gradient(150deg,#EFF1DF 0%,#E9EEDD 46%,#DDE9E2 100%);
    transition:background 1.6s ease;}
  .grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.32;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.8' numOctaves='4'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.42'/></svg>");}

  /* ---- top bar ---- */
  header{position:fixed;top:0;left:0;right:0;z-index:5;
    display:flex;align-items:center;gap:18px;
    padding:calc(env(safe-area-inset-top) + 20px) 24px 14px;
    max-width:var(--w);margin:0 auto;}
  .icon{width:34px;height:34px;flex:none;border:0;background:none;cursor:pointer;padding:0;
    display:grid;place-items:center;border-radius:50%;transition:background .2s,opacity .2s}
  .icon:hover{background:rgba(21,23,15,.06)}
  .icon[disabled]{opacity:.22;pointer-events:none}
  .icon svg{width:21px;height:21px;stroke:var(--ink);stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .rail{flex:1;height:4px;border-radius:4px;background:rgba(21,23,15,.13);overflow:hidden}
  .rail i{display:block;height:100%;width:0;border-radius:4px;background:var(--ink);
    transition:width .55s cubic-bezier(.3,.9,.3,1)}
  .skip{border:0;background:none;font:inherit;font-weight:600;font-size:16px;color:var(--ink);
    cursor:pointer;padding:6px 2px;opacity:1;transition:opacity .2s}
  .skip.hide{opacity:0;pointer-events:none}

  /* ---- content ---- */
  main{position:relative;z-index:3;height:100%;max-width:var(--w);margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 92px) 24px calc(env(safe-area-inset-bottom) + 108px);
    overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
  main::-webkit-scrollbar{display:none}
  .view.anim{animation:in .48s cubic-bezier(.2,.85,.3,1) both}
  @keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .out{animation:out .2s ease forwards}
  @keyframes out{to{opacity:0;transform:translateY(-10px)}}

  .eyebrow{font-size:17px;font-weight:600;color:var(--ink-soft);margin:0 0 14px}
  h1{font-weight:800;font-size:clamp(34px,8.4vw,46px);line-height:1.06;letter-spacing:-.035em;
    margin:0 0 18px;max-width:15ch}
  .q{font-weight:800;font-size:clamp(29px,7.2vw,40px);line-height:1.1;letter-spacing:-.035em;
    margin:0 0 14px;max-width:17ch}
  .hint{font-size:16px;color:var(--ink-soft);margin:0 0 30px;max-width:34ch;font-weight:500}
  .lede{font-size:17px;color:var(--ink-soft);font-weight:500;margin:0 0 14px;max-width:38ch}
  .lede b{color:var(--ink);font-weight:700}

  /* ---- options ---- */
  .opts{display:flex;flex-direction:column;align-items:flex-start;gap:11px;margin-top:8px}
  .opt{
    max-width:100%;border:0;cursor:pointer;font:inherit;font-size:17px;font-weight:600;
    padding:17px 27px;border-radius:999px;background:var(--paper);color:var(--ink);
    box-shadow:var(--shadow);text-align:left;
    transition:transform .18s cubic-bezier(.2,.9,.3,1),background .18s,color .18s,box-shadow .18s;
  }
  .opt:hover{transform:translateX(5px)}
  .opt.on{background:var(--ink);color:#F6F8EC;box-shadow:0 12px 26px -12px rgba(21,23,15,.5)}
  .opt.multi.on{background:var(--lime);color:var(--ink)}
  .opt.multi.on:before{content:"✓ ";font-weight:800}

  /* ---- inputs ---- */
  .field{margin-bottom:16px;max-width:440px}
  .field label{display:block;font-size:14px;font-weight:600;color:var(--ink-soft);margin:0 0 8px 6px}
  .field label i{font-style:normal;color:var(--ink-faint);font-weight:500}
  input,textarea{
    width:100%;padding:17px 22px;border:0;border-radius:22px;background:var(--paper);
    color:var(--ink);font:inherit;font-size:17px;font-weight:600;outline:none;
    box-shadow:var(--shadow);transition:box-shadow .2s}
  input{border-radius:999px}
  textarea{min-height:150px;resize:none;line-height:1.5}
  input:focus,textarea:focus{box-shadow:0 0 0 2.5px var(--ink)}
  input::placeholder,textarea::placeholder{color:var(--ink-faint);font-weight:500}

  /* ---- primary action ---- */
  .fab{position:fixed;z-index:6;right:24px;bottom:calc(env(safe-area-inset-bottom) + 26px);
    display:inline-flex;align-items:center;gap:11px;padding:18px 30px;border:0;border-radius:999px;
    background:var(--ink);color:#F6F8EC;font:inherit;font-weight:700;font-size:17px;cursor:pointer;
    box-shadow:0 16px 34px -14px rgba(21,23,15,.65);transition:transform .2s,opacity .25s}
  .fab:hover{transform:translateY(-2px)}
  .fab[disabled]{opacity:.28;pointer-events:none}
  .fab.hide{display:none}
  .fab.lime{background:var(--lime);color:var(--ink)}
  .cta{display:inline-flex;align-items:center;gap:11px;margin-top:34px;padding:18px 32px;border:0;
    border-radius:999px;background:var(--ink);color:#F6F8EC;font:inherit;font-weight:700;font-size:17px;
    cursor:pointer;box-shadow:0 16px 34px -14px rgba(21,23,15,.65);transition:transform .2s}
  .cta:hover{transform:translateY(-2px)}
  @media (min-width:640px){ .fab{right:calc(50% - var(--w)/2 + 24px)} header{padding-left:24px} }

  /* ---- analysing ---- */
  .scan{margin-top:34px;display:flex;flex-direction:column;gap:16px;max-width:34ch}
  .scan div{display:flex;align-items:center;gap:14px;font-size:17px;font-weight:600;color:var(--ink-soft);
    opacity:0;transform:translateX(-8px);animation:tick .5s cubic-bezier(.2,.9,.3,1) forwards}
  @keyframes tick{to{opacity:1;transform:none}}
  .tick{width:9px;height:9px;border-radius:50%;background:var(--lime);flex:none;
    box-shadow:0 0 0 4px rgba(220,242,92,.35)}

  /* ---- result ---- */
  .score{display:flex;align-items:flex-start;gap:16px;margin:6px 0 4px}
  .num{position:relative;font-weight:800;font-size:clamp(78px,20vw,108px);line-height:.9;letter-spacing:-.055em}
  .num:after{content:"";position:absolute;left:-8px;right:-10px;bottom:6px;height:.34em;
    background:var(--lime);border-radius:6px;z-index:-1;transform:scaleX(0);transform-origin:left;
    transition:transform .7s cubic-bezier(.2,.9,.3,1) .35s}
  .num.lit:after{transform:scaleX(1)}
  .num i{font-style:normal;font-size:.28em;font-weight:700;color:var(--ink-soft);letter-spacing:-.02em}
  .band{font-size:15px;font-weight:700;padding:8px 16px;border-radius:999px;background:var(--paper);
    box-shadow:var(--shadow);margin-top:14px;white-space:nowrap}
  .leak{background:var(--paper);border-radius:26px;padding:22px 24px;margin-top:12px;box-shadow:var(--shadow)}
  .leak .top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:8px}
  .leak h4{margin:0;font-size:19px;font-weight:800;letter-spacing:-.025em}
  .sev{font-size:12px;font-weight:700;letter-spacing:.02em;padding:5px 11px;border-radius:999px;
    background:rgba(21,23,15,.07);flex:none}
  .sev.high{background:var(--lime)}
  .leak p{margin:0;font-size:15.5px;font-weight:500;color:var(--ink-soft);line-height:1.5}
  .leak p b{color:var(--ink);font-weight:700}
  .note{margin-top:20px;font-size:14.5px;font-weight:500;color:var(--ink-soft);line-height:1.55;max-width:42ch}
  ul.deliver{list-style:none;padding:0;margin:22px 0 0;max-width:42ch}
  ul.deliver li{padding:13px 0;border-top:1px solid var(--line);font-size:16px;font-weight:600;
    display:flex;gap:12px;align-items:flex-start}
  ul.deliver li:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime);
    box-shadow:0 0 0 3px rgba(220,242,92,.4);margin-top:8px;flex:none}

  /* ---- warm-up blocks ---- */
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0 0;padding:0;list-style:none}
  .chips li{font-size:13px;font-weight:600;color:var(--ink-soft);
    background:rgba(21,23,15,.05);border-radius:999px;padding:7px 14px}
  .gets{list-style:none;padding:0;margin:20px 0 0;max-width:44ch}
  .gets li{position:relative;padding:0 0 0 28px;margin-bottom:10px;font-size:15.5px;font-weight:600;line-height:1.35}
  .gets li::before{content:"";position:absolute;left:0;top:.36em;width:16px;height:9px;
    border-left:2.4px solid var(--ink);border-bottom:2.4px solid var(--ink);transform:rotate(-45deg)}
  .gets li span{display:block;font-weight:500;font-size:14.5px;color:var(--ink-soft);margin-top:3px}
  .reassure{margin:24px 0 0;font-size:14.5px;font-weight:500;color:var(--ink-soft);
    max-width:40ch;line-height:1.55;border-left:2px solid var(--lime);padding-left:14px}
  .val{background:var(--paper);border-radius:26px;padding:22px 24px;margin-top:12px;box-shadow:var(--shadow)}
  .val h4{margin:0 0 6px;font-size:16.5px;font-weight:800;letter-spacing:-.02em}
  .val p{margin:0;font-size:14.5px;font-weight:500;color:var(--ink-soft);line-height:1.55}
  .val .step{font-size:12.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.1em;
    text-transform:uppercase;display:block;margin-bottom:8px}
  .pull{margin:30px 0 0;font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.3;max-width:36ch}
  .kicker{font-size:15px;font-weight:700;color:var(--ink-soft);margin:34px 0 10px}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
  :focus-visible{outline:2.5px solid var(--ink);outline-offset:3px}

/* booking block on the result screen */
.book{margin-top:34px;padding:28px 24px;border-radius:22px;
  background:rgba(255,255,255,.7);border:1px solid rgba(21,23,15,.08);
  box-shadow:0 20px 44px -26px rgba(21,23,15,.35)}
.book h3{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:6px 0 10px}
.book p{font-size:15px;line-height:1.55;opacity:.72;margin-bottom:20px}
.book .cta{display:inline-flex;align-items:center;justify-content:center;width:100%}
.book .ref{margin:14px 0 0;font-size:12px;letter-spacing:.06em;opacity:.45;text-align:center}
</style>
</head>
<body>

<div class="wash"></div><div class="grain"></div>

<header>
  <button class="icon" id="back" aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  </button>
  <div class="rail"><i id="fill"></i></div>
  <button class="skip hide" id="skip">Skip</button>
</header>

<main id="main"><div class="view anim" id="view"></div></main>
<button class="fab hide" id="next">Continue</button>

<script>
/* ------------------------------------------------------------------ */
/*  CONFIG                                                             */
/* ------------------------------------------------------------------ */
const CONFIG = {
  /* Route A (recommended): your Make.com / n8n webhook. In the scenario add a
     Bitrix24 module "Create a lead" and map the fields from the JSON payload. */
  webhookUrl : "https://hook.eu2.make.com/axz2sjontvotpc1ez6vs7h41fqmcbxlh",

  /* Route B (optional, no middleware): a Bitrix24 INBOUND webhook URL with the
     crm scope only, e.g. https://yourportal.bitrix24.eu/rest/1/xxxxxxxxxxxx/
     Leave empty if you use Route A. The token is visible in page source, so give
     it the crm scope and nothing else. */
  bitrixWebhookUrl : "",
  bitrixAssignedById : "",          // optional: Bitrix user ID the lead goes to

  bookingLink: "https://cal.com/ishwari-drlaqh/revenue-audit"
};

/* ------------------------------------------------------------------ */
const S = {
  intro:"", contact:"About you",
  a:"Your agency", b:"Lead management", c:"Your CRM",
  d:"Follow-up", e:"Daily operations", f:"Where you're heading", g:"Investment"
};

const STEPS = [
 {type:"intro", sect:S.intro},

 {type:"contact", sect:S.contact, q:"Who are we preparing this for?",
  hint:"We'll send your analysis and roadmap here.",
  fields:[
    {id:"name",    label:"Full name",       ph:"Ahmed Al Mansouri"},
    {id:"company", label:"Company name",    ph:"Skyline Properties"},
    {id:"email",   label:"Work email",      ph:"you@agency.ae", t:"email"},
    {id:"whatsapp",label:"WhatsApp number", ph:"+971 50 000 0000", t:"tel"},
    {id:"website", label:"Company website", ph:"agency.ae", optional:true}
  ]},

 /* 1 */ {type:"single", sect:S.a, q:"How many agents work in your agency?",
   opts:["1–5","6–15","16–30","31–50","50+"]},
 /* 2 */ {type:"single", sect:S.a, q:"Which market do you operate in?",
   opts:["Dubai","Abu Dhabi","UAE — nationwide","International","Other"]},
 /* 3 */ {type:"single", sect:S.a, q:"How many new leads arrive each month?",
   hint:"A best estimate is fine.",
   opts:["Under 100","100–300","300–700","700–1,500","1,500+"]},
 /* 4 */ {type:"multi", sect:S.a, q:"Where do most of your leads come from?",
   hint:"Select everything that applies.",
   opts:["Property Finder","Bayut","Meta Ads","Google Ads","Organic social","Referrals","Walk-ins","Other"]},

 /* 5 */ {type:"single", sect:S.b, q:"How fast does your team reply to a new enquiry?",
   opts:["Under 1 minute","1–5 minutes","5–15 minutes","15–30 minutes","30–60 minutes","1–2 hours","More than 2 hours"],
   cat:"speed", pts:[0,2,5,7,8,9,10]},
 /* 6 */ {type:"single", sect:S.b, q:"What happens to leads that arrive after hours?",
   opts:["AI replies instantly","Team replies next morning","Depends on the agent","Nobody replies until the office opens","Not sure"],
   cat:"speed", pts:[0,5,7,8,7]},
 /* 7 */ {type:"single", sect:S.b, q:"How are new leads assigned?",
   opts:["Automatically","A manager assigns them","Agents pick their own","There's no set process"],
   cat:"routing", pts:[0,3,5,6]},
 /* 8 */ {type:"multi", sect:S.b, q:"How do agents talk to leads?",
   hint:"Select everything that applies.",
   opts:["WhatsApp","Phone calls","CRM","Email","Telegram","SMS"]},

 /* 9 */ {type:"single", sect:S.c, q:"Which CRM do you use today?",
   opts:["Bitrix24","Zoho","HubSpot","Salesforce","Pipedrive","No CRM","Other"],
   cat:"crm", pts:[1,1,1,1,1,6,2]},
 /*10 */ {type:"single", sect:S.c, q:"Does every lead make it into the CRM?",
   opts:["Always","Usually","Sometimes","Rarely","No"],
   cat:"crm", pts:[0,3,5,7,8]},
 /*11 */ {type:"multi", sect:S.c, q:"What can management see right now?",
   hint:"Select everything you can pull up today.",
   opts:["Response times","Agent performance","Conversion rates","Lead sources","Pipeline","None of the above"],
   cat:"visibility", invert:true, max:8},

 /*12 */ {type:"single", sect:S.d, q:"What happens when a lead doesn't answer?",
   opts:["Automated follow-up runs","An agent follows up manually","Depends on the agent","It's usually forgotten"],
   cat:"followup", pts:[0,4,7,10]},
 /*13 */ {type:"single", sect:S.d, q:"How many follow-up attempts are normally made?",
   opts:["1","2","3","5 or more","We don't know"],
   cat:"followup", pts:[8,6,4,0,8]},
 /*14 */ {type:"single", sect:S.d, q:"How many old leads are sitting in your CRM?",
   hint:"Contacts that were never closed and are no longer worked.",
   opts:["Under 100","100–500","500–2,000","2,000–10,000","10,000+"],
   cat:"database", pts:[1,3,5,7,8]},

 /*15 */ {type:"multi", sect:S.e, q:"Which repetitive tasks eat the most time?",
   hint:"Select everything that applies.",
   opts:["Replying to enquiries","Qualifying buyers","Booking viewings","Chasing follow-ups","Updating the CRM","Internal reporting","Preparing documents","Managing agents"],
   cat:"load", perItem:1, max:6},
 /*16 */ {type:"multi", sect:S.e, q:"What would you automate first?",
   hint:"Select everything that applies.",
   opts:["Instant lead response","WhatsApp AI","Lead qualification","Appointment booking","CRM automation","Follow-up automation","Internal operations","Dashboards","AI voice agent"]},

 /*17 */ {type:"text", sect:S.f, q:"What is your biggest challenge today?",
   ph:"Tell us in your own words."},
 /*18 */ {type:"text", sect:S.f, q:"If you could fix only one thing in 90 days, what would it be?",
   ph:"The one problem that costs you most."},
 /*19 */ {type:"text", sect:S.f, q:"What's your main goal for the next 12 months?",
   ph:"Growth target, market, headcount — whatever matters most."},

 /*20 */ {type:"single", sect:S.g, q:"When are you planning to implement automation?",
   opts:["Immediately","Within 30 days","Within 90 days","Later this year","Just researching"]},
 /*21 */ {type:"single", sect:S.g, q:"Has your agency invested in automation before?",
   opts:["Yes","No"]},
 /*22 */ {type:"single", sect:S.g, q:"If it clearly lifts revenue and frees your team's time, what investment would you consider?",
   opts:["Under $2,000","$2,000–$4,000","$4,000–$8,000","$8,000–$15,000","$15,000+","We don't know yet"]},
 /*23 */ {type:"single", sect:S.g, q:"Who makes the final decision?",
   opts:["I do","A business partner","A director","Several decision makers"]},
 /*24 */ {type:"single", sect:S.g, q:"If we find clear opportunities, are you open to discussing how to implement them?",
   opts:["Yes","Maybe","No"]},
 /*25 */ {type:"text", sect:S.g, q:"Anything else we should know before we build your roadmap?",
   ph:"Optional — but the more context, the sharper the roadmap.", optional:true},

 {type:"analysing", sect:""},
 {type:"result",    sect:"Your result"}
];

const CATS = {
  speed:     {max:18, name:"Speed of first response",
    d:"Enquiries wait long enough for buyers to book with whoever answered first.",
    r:"Instant AI first reply on every channel, 24/7, handing over to an agent once intent is confirmed."},
  routing:   {max:6,  name:"Lead routing",
    d:"Leads reach agents through a process that depends on who happens to be watching.",
    r:"Rule-based assignment with clear ownership, timers and automatic escalation."},
  crm:       {max:14, name:"CRM discipline",
    d:"Part of your pipeline lives outside the CRM, so it can't be worked or measured.",
    r:"Every channel writes into the CRM automatically — nothing left to manual entry."},
  visibility:{max:8,  name:"Management visibility",
    d:"You're managing on what the team reports rather than on live numbers.",
    r:"One live dashboard: response time, activity, conversion and source quality."},
  followup:  {max:18, name:"Follow-up persistence",
    d:"Most deals close after several touches — yours stop far earlier.",
    r:"Multi-step sequences across WhatsApp and calls, paused the moment a human replies."},
  database:  {max:8,  name:"Dormant database",
    d:"A large share of leads you already paid for sits idle and is never re-engaged.",
    r:"Structured reactivation campaigns that surface the buyers who are ready now."},
  load:      {max:6,  name:"Operational load",
    d:"Senior time goes into admin work that doesn't need a person.",
    r:"Automate booking, qualification, CRM updates and reporting first."}
};

/* ------------------------------------------------------------------ */
const data = {}, points = {};
let i = 0;
const view = document.getElementById("view");
const main = document.getElementById("main");
const next = document.getElementById("next");
const back = document.getElementById("back");
const skip = document.getElementById("skip");
const fill = document.getElementById("fill");
const total = STEPS.filter(s=>["single","multi","text"].includes(s.type)).length;
const qNum  = idx => STEPS.filter((x,n)=>n<=idx && ["single","multi","text"].includes(x.type)).length;

function go(n){
  view.classList.add("out");
  setTimeout(()=>{ i=n; view.classList.remove("out"); render(); }, 190);
}

function render(){
  const s = STEPS[i], num = qNum(i);
  const p = Math.min(1, i/(STEPS.length-2));
  fill.style.width = (p*100)+"%";
  document.documentElement.style.setProperty("--p", p.toFixed(3));
  main.scrollTop = 0;
  view.classList.remove("anim"); void view.offsetWidth; view.classList.add("anim");

  back.disabled = i===0 || s.type==="analysing" || s.type==="result";
  skip.classList.add("hide");
  next.className = "fab hide"; next.disabled = true; next.textContent = "Continue";

  ({intro:renderIntro, contact:renderContact, single:renderSingle,
    multi:renderMulti, text:renderText, analysing:renderAnalysing, result:renderResult}[s.type])(s, num);
}
const head = (s,num) => `${s.sect?`<p class="eyebrow">${s.sect}</p>`:""}
  <p class="q">${s.q}</p>${s.hint?`<p class="hint">${s.hint}</p>`:""}`;

function renderIntro(){
  view.innerHTML = `
    <p class="eyebrow">ScaleFlow · Dubai real estate</p>
    <h1>Where is your agency losing deals?</h1>
    <p class="lede">Enquiries arrive, sit for hours, and quietly go to whoever replied first. In 5 minutes you'll see exactly where yours escape.</p>
    <ul class="gets">
      <li>Your Revenue Leak Score, 0–100</li>
      <li>The three places your pipeline leaks fastest</li>
      <li>What to fix first — and what to leave alone</li>
    </ul>
    <button class="cta" id="start">Start my assessment</button>
    <ul class="chips">
      <li>25 questions</li><li>≈5 minutes</li><li>No CRM access</li><li>Free</li>
    </ul>`;
  document.getElementById("start").onclick = ()=>go(i+1);
}

function renderContact(s){
  view.innerHTML = head(s) + s.fields.map(f=>`
    <div class="field">
      <label for="${f.id}">${f.label}${f.optional?" <i>optional</i>":""}</label>
      <input id="${f.id}" type="${f.t||"text"}" placeholder="${f.ph}" value="${data[f.id]||""}">
    </div>`).join("");
  const req = s.fields.filter(f=>!f.optional).map(f=>document.getElementById(f.id));
  const check = ()=> next.disabled = !req.every(el=>el.value.trim().length>1);
  s.fields.forEach(f=>{ const el=document.getElementById(f.id);
    el.oninput = ()=>{ data[f.id]=el.value.trim(); check(); }; });
  next.className = "fab"; check(); next.onclick = ()=>go(i+1);
}

function renderSingle(s,num){
  view.innerHTML = head(s) + `<div class="opts">${s.opts.map((o,n)=>
    `<button class="opt ${data["q"+num]===o?"on":""}" data-n="${n}">${o}</button>`).join("")}</div>`;
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const n = +b.dataset.n;
    data["q"+num] = s.opts[n];
    if(s.cat && s.pts) points["q"+num] = {cat:s.cat, p:s.pts[n]};
    view.querySelectorAll(".opt").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    setTimeout(()=>go(i+1), 230);
  });
}

function renderMulti(s,num){
  const sel = new Set(data["q"+num]||[]);
  view.innerHTML = head(s) + `<div class="opts">${s.opts.map((o,n)=>
    `<button class="opt multi ${sel.has(o)?"on":""}" data-n="${n}">${o}</button>`).join("")}</div>`;
  const sync = ()=>{
    data["q"+num] = [...sel];
    next.disabled = sel.size===0;
    if(s.cat) scoreMulti(s,[...sel],"q"+num);
  };
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const o = s.opts[+b.dataset.n];
    sel.has(o) ? (sel.delete(o), b.classList.remove("on")) : (sel.add(o), b.classList.add("on"));
    sync();
  });
  next.className = "fab"; sync(); next.onclick = ()=>go(i+1);
}

function renderText(s,num){
  view.innerHTML = head(s) + `<div class="field" style="max-width:520px">
    <textarea id="ta" placeholder="${s.ph}">${data["q"+num]||""}</textarea></div>`;
  const ta = document.getElementById("ta");
  const check = ()=> next.disabled = !(s.optional || ta.value.trim().length>2);
  ta.oninput = ()=>{ data["q"+num]=ta.value.trim(); check(); };
  next.className = "fab"; check();
  if(s.optional){ skip.classList.remove("hide"); skip.onclick = ()=>go(i+1); }
  next.onclick = ()=>go(i+1);
}

/* ---------- scoring ---------- */
function scoreMulti(s, sel, key){
  let p = 0;
  if(s.invert){
    const have = sel.includes("None of the above") ? 0 : sel.length;
    p = Math.max(0, s.max - have*1.6);
  } else if(s.perItem){
    p = Math.min(s.max, sel.length*s.perItem);
  }
  points[key] = {cat:s.cat, p};
}
function compute(){
  const got = {}; Object.keys(CATS).forEach(k=>got[k]=0);
  Object.values(points).forEach(({cat,p})=>{ if(cat) got[cat]+=p; });
  if(got.followup < 6) got.database *= 0.5;
  const sum = Object.values(got).reduce((a,b)=>a+b,0);
  const cap = Object.values(CATS).reduce((a,c)=>a+c.max,0);
  const score = Math.max(4, Math.min(97, Math.round(sum/cap*100)));
  const top = Object.keys(CATS).map(k=>({k, pct:Math.round(got[k]/CATS[k].max*100)}))
    .sort((a,b)=>b.pct-a.pct).slice(0,3);
  data.leakScore = score; data.topBottlenecks = top.map(t=>CATS[t.k].name);
  return {score, top};
}
/* every question with its answer, in the order they were asked */
function buildAnswers(){
  const out = []; let n = 0;
  STEPS.forEach(st=>{
    if(["single","multi","text"].includes(st.type)){
      n++;
      const v = data["q"+n];
      out.push({ n, section: st.sect || "", question: st.q,
                 answer: Array.isArray(v) ? v.join(", ") : (v || "—") });
    }
  });
  return out;
}
function answersText(list){
  return list.map(a=>`${a.n}. ${a.question}\n   → ${a.answer}`).join("\n");
}

/* cal.com link, pre-filled with what they just told us */
function bookingUrl(){
  let u;
  try { u = new URL(CONFIG.bookingLink); } catch(e){ return CONFIG.bookingLink; }
  if(data.name)  u.searchParams.set("name",  data.name);
  if(data.email) u.searchParams.set("email", data.email);
  u.searchParams.set("assessment_id", assessmentId);
  /* cal.com wants the phone in E.164, otherwise its input rejects it */
  if(data.whatsapp){
    let ph = data.whatsapp.replace(/[^\d+]/g,"").replace(/^00/,"+");
    if(!ph.startsWith("+")){
      if(ph.startsWith("971"))      ph = "+" + ph;
      else if(ph.startsWith("0"))   ph = "+971" + ph.slice(1);   // UAE local format
      else                          ph = "+971" + ph;
    }
    u.searchParams.set("attendeePhoneNumber", ph);
  }
  u.searchParams.set("notes",
    `Ref ${assessmentId} | Revenue Leak Score: ${data.leakScore}/100`
    + ` | Top leaks: ${(data.topBottlenecks||[]).join(", ")}`
    + ` | Agency: ${data.company||"—"}`
    + ` | WhatsApp: ${data.whatsapp||"—"}`);
  return u.toString();
}

/* flatten {fields:{EMAIL:[{VALUE:"x"}]}} into Bitrix's bracket notation,
   sent form-encoded so the browser makes a simple request (no CORS preflight) */
function flatten(obj, prefix, out){
  out = out || new URLSearchParams();
  Object.keys(obj).forEach(k=>{
    const val = obj[k], key = prefix ? `${prefix}[${k}]` : k;
    if(val === undefined || val === null || val === "") return;
    (typeof val === "object") ? flatten(val, key, out) : out.append(key, val);
  });
  return out;
}

/* one reference per run — ties the assessment to the cal.com booking */
const assessmentId = "RLA-" + Date.now().toString(36).toUpperCase()
  + "-" + Math.random().toString(36).slice(2,6).toUpperCase();
data.assessmentId = assessmentId;

let sent = false;
function submit(){
  if(sent) return; sent = true;
  compute();
  const answers = buildAnswers();
  const profile = {};
  answers.forEach(a=>{
    if(/how many agents/i.test(a.question))            profile.agencySize   = a.answer;
    if(/how many new leads/i.test(a.question))         profile.leadVolume   = a.answer;
    if(/which crm/i.test(a.question))                  profile.currentCrm   = a.answer;
    if(/how many old leads/i.test(a.question))         profile.databaseSize = a.answer;
    if(/what investment/i.test(a.question))            profile.budget       = a.answer;
    if(/invested in automation/i.test(a.question))     profile.pastAutomation = a.answer;
  });

  const payload = {
    ...data,
    ...profile,
    answers,
    answersText : answersText(answers),
    bookingLink : bookingUrl(),
    submittedAt : new Date().toISOString(),
    source      : "revenue-leak-assessment",
    pageUrl     : location.href,
    utm         : Object.fromEntries(new URLSearchParams(location.search))
  };

  /* Route A — Make.com / n8n (which then creates the Bitrix24 lead) */
  if(CONFIG.webhookUrl){
    fetch(CONFIG.webhookUrl,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)}).catch(e=>console.error("Webhook failed:",e));
  }

  /* Route B — straight into Bitrix24 CRM as a lead */
  if(CONFIG.bitrixWebhookUrl){
    const base = CONFIG.bitrixWebhookUrl.replace(/\/+$/,"");
    const body = flatten({
      fields:{
        TITLE: `Revenue Leak Assessment — ${data.company||data.name||"lead"} (${data.leakScore}/100)`,
        NAME: data.name || "",
        COMPANY_TITLE: data.company || "",
        SOURCE_ID: "WEB",
        SOURCE_DESCRIPTION: "Revenue Leak Assessment",
        STATUS_ID: "NEW",
        OPENED: "Y",
        ASSIGNED_BY_ID: CONFIG.bitrixAssignedById || "",
        COMMENTS: `Revenue Leak Score: ${data.leakScore}/100\n`
                + `Top bottlenecks: ${(data.topBottlenecks||[]).join(", ")}\n`
                + `Booking link: ${payload.bookingLink}\n\n${payload.answersText}`,
        EMAIL: data.email    ? [{VALUE:data.email,    VALUE_TYPE:"WORK"}] : undefined,
        PHONE: data.whatsapp ? [{VALUE:data.whatsapp, VALUE_TYPE:"WORK"}] : undefined,
        WEB:   data.website  ? [{VALUE:data.website,  VALUE_TYPE:"WORK"}] : undefined
      }
    });
    fetch(base+"/crm.lead.add.json",{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
      body: body.toString()
    }).catch(e=>console.error("Bitrix failed:",e));
  }

  if(!CONFIG.webhookUrl && !CONFIG.bitrixWebhookUrl) console.log("Assessment payload:", payload);
}

/* tell the CRM they went through to booking */
function trackBooking(){
  if(!CONFIG.webhookUrl) return;
  const body = JSON.stringify({event:"booking_clicked", email:data.email, name:data.name,
    company:data.company, leakScore:data.leakScore, at:new Date().toISOString(),
    source:"revenue-leak-assessment"});
  (navigator.sendBeacon)
    ? navigator.sendBeacon(CONFIG.webhookUrl, new Blob([body],{type:"application/json"}))
    : fetch(CONFIG.webhookUrl,{method:"POST",headers:{"Content-Type":"application/json"},body,keepalive:true}).catch(()=>{});
}

/* ---------- nav ---------- */
back.onclick = ()=>{ if(i>0) go(i-1); };
document.addEventListener("keydown", e=>{
  const s = STEPS[i];
  if(e.key==="Enter" && !next.disabled && !next.classList.contains("hide") && e.target.tagName!=="TEXTAREA"){
    e.preventDefault(); next.click(); return;
  }
  if(e.key==="Escape" && !back.disabled) back.click();
  if((s.type==="single"||s.type==="multi") && /^[1-9]$/.test(e.key)){
    const b = view.querySelectorAll(".opt")[+e.key-1]; if(b) b.click();
  }
});

render();
